name: release

# Triggered by pushing a version tag (v*), e.g. `bun run release --push`.
# Builds the artifacts, publishes a GitHub release with generated notes,
# then updates the Homebrew cask in this repo (it doubles as the tap).
# See docs/releasing.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: "Blobfish · Release · build ${{ matrix.name }} · ${{ github.ref_name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS only for now. To bring Linux back, re-add a matrix entry:
          #   - name: linux
          #     os: ubuntu-latest
          #     target: --linux
          # (plus a libfuse apt step for AppImage — see git history).
          # arm64 only (Apple Silicon) — no x64/Intel builds.
          - name: macos
            os: macos-14
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Unsigned on macOS unless CSC_* secrets are configured — see
      # docs/releasing.md ("Code signing"). Brew casks work either way.
      - name: package
        run: bun run dist:ci -- ${{ matrix.target }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: error

  release:
    name: "Blobfish · Release · publish + cask · ${{ github.ref_name }}"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs full history and tags

      - name: install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: generate release notes
        run: git-cliff --latest --strip all --output RELEASE_NOTES.md

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      # This repo doubles as the Homebrew tap (brew taps any repo with a Casks/
      # dir via `brew tap pylotlight/blobfish <url>`). Done in this job instead
      # of a separate one so the cask bump doesn't wait in the runner queue
      # again. Token pushes don't re-trigger workflows, so no loop.
      # pre-release tags (anything with a '-', e.g. v0.3.0-beta.1) never touch
      # the cask, so brew users stay on the latest stable build.
      - uses: oven-sh/setup-bun@v2
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          bun-version-file: .bun-version

      - name: update homebrew cask on main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256=$(shasum -a 256 "dist/Blobfish-${version}-mac-arm64.zip" | cut -d ' ' -f 1)
          git fetch origin main
          git checkout -B main origin/main
          bun scripts/render-cask.ts --version "$version" --sha256 "$sha256" --out Casks/blobfish.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/blobfish.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "chore(tap): blobfish ${version}"
            git push origin main
          fi
