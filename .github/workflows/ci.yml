name: ci

on:
  push:
  pull_request:
  # electron-bump.yml starts ci on its branch this way (pushes made with the workflow token don't trigger it).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:css
