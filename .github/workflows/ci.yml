name: ci

on:
  # main only: feature branches are covered by their PR run, and release tags
  # are already built by release.yml, so no duplicate runs queueing up.
  push:
    branches: [main]
  pull_request:
  # electron-bump.yml starts ci on its branch this way (pushes made with the workflow token don't trigger it).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Blobfish · CI · verify · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:css
